apiVersion: v1
kind: Secret
metadata:
  name: ${INFRASTRUCTURE_NAME}-kubeconfig
  namespace: openshift-cluster-api
  annotations:
    capi-operator.openshift.io/adopt-existing: "always"
  labels:
    cluster.x-k8s.io/cluster-name: ${INFRASTRUCTURE_NAME}
type: cluster.x-k8s.io/secret
stringData:
  # This kubeconfig contains only static connection data. Consumers use their
  # own projected ServiceAccount token and CA files.
  value: |
    apiVersion: v1
    clusters:
    - name: management-cluster
      cluster:
        server: https://kubernetes.default.svc:443
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    contexts:
    - name: management-cluster
      context:
        cluster: management-cluster
        namespace: openshift-cluster-api
        user: service-account
    current-context: management-cluster
    users:
    - name: service-account
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
