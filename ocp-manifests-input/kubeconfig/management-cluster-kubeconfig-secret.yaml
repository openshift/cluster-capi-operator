apiVersion: v1
kind: Secret
metadata:
  name: ${INFRASTRUCTURE_NAME}-kubeconfig
  namespace: openshift-cluster-api
  annotations:
    capi-operator.openshift.io/adopt-existing: "always"
  labels:
    cluster.x-k8s.io/cluster-name: ${INFRASTRUCTURE_NAME}
type: cluster.x-k8s.io/secret
# The value is a static in-cluster kubeconfig. It contains no bearer token or
# embedded CA; consumers use their own projected ServiceAccount files.
data:
  value: 
