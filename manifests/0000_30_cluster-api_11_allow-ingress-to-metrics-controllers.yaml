# Allow platform Prometheus to scrape Cluster API provider controller metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    exclude.release.openshift.io/internal-openshift-hosted: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    release.openshift.io/feature-gate: "ClusterAPIMachineManagement"
    capability.openshift.io/name: ClusterAPI
  name: allow-ingress-to-metrics-controllers
  namespace: openshift-cluster-api
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/instance: k8s
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: control-plane
      operator: In
      values:
      - capa-controller-manager
      - capg-controller-manager
      - capz-controller-manager
      - capv-controller-manager
      - capo-controller-manager
      - capibm-controller-manager
      - capo-infracluster-controller
  policyTypes:
  - Ingress
