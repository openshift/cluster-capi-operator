# This policy works with the deny-all policy to ensure webhook validation
# is accessible while maintaining the default-deny security model for other traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    release.openshift.io/feature-gate: CRDCompatibilityRequirementOperator
    capability.openshift.io/name: CompatibilityRequirements
  name: allow-ingress-to-webhook
  namespace: openshift-compatibility-requirements-operator
spec:
  ingress:
  - from:
    # Standalone kube-apiserver and host-networked Konnectivity agents.
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/host-network: ""
    # Pod-networked Konnectivity agents during bootstrap and on hosted clusters.
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - openshift-bootstrap-konnectivity
          - kube-system
      podSelector:
        matchLabels:
          app: konnectivity-agent
    ports:
    - port: 9443 # compatibility-requirements-controllers-webhook-service port
      protocol: TCP
  podSelector: {} # Allow ingress to all pods in the namespace
  policyTypes:
  - Ingress
