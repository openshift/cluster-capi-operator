# Allow platform Prometheus to scrape Cluster API operator and operand metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    exclude.release.openshift.io/internal-openshift-hosted: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    release.openshift.io/feature-gate: "ClusterAPIOperator"
    capability.openshift.io/name: ClusterAPI
  name: allow-ingress-to-metrics-operators
  namespace: openshift-cluster-api-operator
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/instance: k8s
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: k8s-app
      operator: In
      values:
      - capi-operator
      - capi-installer
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    exclude.release.openshift.io/internal-openshift-hosted: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    release.openshift.io/feature-gate: "ClusterAPIMachineManagement"
    capability.openshift.io/name: ClusterAPI
  name: allow-ingress-to-metrics-operators
  namespace: openshift-cluster-api
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/instance: k8s
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: k8s-app
      operator: In
      values:
      - capi-controllers
      - machine-api-migration
  policyTypes:
  - Ingress
