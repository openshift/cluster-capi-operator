# Allow the kube-apiserver to reach Cluster API admission webhooks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    exclude.release.openshift.io/internal-openshift-hosted: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    release.openshift.io/feature-gate: "ClusterAPIMachineManagement"
    capability.openshift.io/name: ClusterAPI
  name: allow-ingress-to-webhook
  namespace: openshift-cluster-api
spec:
  ingress:
  - from:
    # OVN uses this policy group for the host-networked kube-apiserver.
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/host-network: ""
    # The bootstrap kube-apiserver reaches pod IPs through these agents.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-bootstrap-konnectivity
      podSelector:
        matchLabels:
          app: konnectivity-agent
    ports:
    - port: 9443 # capi-controllers-webhook-service port
      protocol: TCP
    - port: 443 # Provider webhook services port (capi, capa, capv)
      protocol: TCP
  podSelector: {} # Allow ingress to all pods in the namespace
  policyTypes:
  - Ingress
