# This NetworkPolicy allows egress traffic required for the capi-controllers
# deployment in the openshift-cluster-api namespace.
# The controllers need broad internet access for cluster management operations,
# cloud provider API calls, and communication with various services.
#
# This approach is more practical than overly granular rules since the operator
# needs broad access to function properly in various environments.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    exclude.release.openshift.io/internal-openshift-hosted: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    release.openshift.io/feature-gate: "ClusterAPIMachineManagement"
    capability.openshift.io/name: ClusterAPI
  name: allow-egress-operators
  namespace: openshift-cluster-api
spec:
  egress:
  # Allow all egress traffic - operator needs broad access
  - {} # Empty rule allows all egress
  podSelector:
    matchExpressions:
    - key: k8s-app
      operator: In
      values:
      - capi-controllers
  policyTypes:
  - Egress
---
# This NetworkPolicy allows egress traffic required for the machine-api-migration
# deployment in the openshift-cluster-api namespace.
# The migration controller only needs access to the Kubernetes API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    exclude.release.openshift.io/internal-openshift-hosted: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    release.openshift.io/feature-gate: "ClusterAPIMachineManagement"
    capability.openshift.io/name: ClusterAPI
  name: allow-egress-machine-api-migration
  namespace: openshift-cluster-api
spec:
  egress:
  - ports:
    # Allow egress traffic to kube-apiserver
    - port: 6443
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: k8s-app
      operator: In
      values:
      - machine-api-migration
  policyTypes:
  - Egress
